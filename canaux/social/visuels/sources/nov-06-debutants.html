<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Nov 06 Débuter : choisir son niveau</title>
<link rel="stylesheet" href="social.css">
<style>
  /* Repères de niveau repris de la FAQ de fitmates.net/randonnees-week-end-ile-de-france (relevé du 26/10/2026) */
  .lv { display: flex; align-items: center; gap: 28px; background: #fff; border-radius: 34px; padding: 30px 34px; margin-bottom: 22px; box-shadow: 0 18px 44px rgba(120,50,0,.16); }
  .lv .lvl { flex: none; margin: 0; width: 250px; text-align: center; font-size: 28px; padding: 12px 0; }
  .lv p { font-size: 33px; font-weight: 700; line-height: 1.2; }
  .lv p small { display: block; font-size: 24px; font-weight: 500; color: var(--muted); margin-top: 4px; }
  .tip { display: flex; align-items: center; gap: 18px; margin-top: 30px; background: var(--ink); color: #fff; border-radius: 999px; padding: 22px 34px; font-size: 28px; font-weight: 700; }
  .tip i { display: flex; flex: none; width: 36px; height: 36px; color: var(--lime); }
</style></head>
<body><div class="canvas post cream">
  <div class="head">
    <div class="kicker">🥾 Débuter en groupe</div>
    <h1>Première rando : <em>quel niveau choisir ?</em></h1>
    <p class="sub">Les repères pour lire une fiche de sortie</p>
  </div>
  <div class="zone" style="top:660px">
    <div class="lv"><span class="lvl l1">Débutant</span><p>8 à 12 km<small>avec peu de dénivelé</small></p></div>
    <div class="lv"><span class="lvl l2">Intermédiaire</span><p>12 à 20 km<small>pour qui marche déjà régulièrement</small></p></div>
    <div class="lv"><span class="lvl l3">Sportif</span><p>Plus de 20 km<small>ou un dénivelé marqué</small></p></div>
    <div class="tip"><i data-icon="chat"></i>Un doute ? Pose la question dans le chat</div>
  </div>
</div>
<script src="social.js"></script></body></html>
