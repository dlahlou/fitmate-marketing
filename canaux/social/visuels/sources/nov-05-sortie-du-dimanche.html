<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Nov 05 Organise ta sortie du dimanche</title>
<link rel="stylesheet" href="social.css">
<style>
  .bubble { background: #fff; color: var(--ink); border-radius: 40px 40px 40px 12px; padding: 34px 40px; box-shadow: 0 24px 60px rgba(0,0,0,.35);
    border: 4px solid transparent; background-image: linear-gradient(#fff,#fff), linear-gradient(120deg, var(--orange), var(--red)); background-origin: border-box; background-clip: padding-box, border-box; }
  .bubble small { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; color: var(--accent-dark); text-transform: uppercase; letter-spacing: .08em; }
  .bubble small i { display: flex; width: 26px; height: 26px; }
  .bubble p { font-size: 38px; line-height: 1.3; font-weight: 600; margin-top: 14px; }
  .steps { display: flex; gap: 20px; margin-top: 40px; }
  .step { flex: 1; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.16); border-radius: 30px; padding: 26px 22px; }
  .step span { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 28px; color: var(--ink); background: var(--lime); }
  .step b { display: block; font-size: 29px; line-height: 1.2; font-weight: 700; margin-top: 16px; }
</style></head>
<body><div class="canvas post ink">
  <div class="head">
    <div class="kicker">✨ Ta sortie du dimanche</div>
    <h1>Dimanche, <em>c'est toi qui proposes</em></h1>
    <p class="sub">Une phrase dans l'app, et ta sortie est en ligne</p>
  </div>
  <div class="zone" style="top:700px">
    <div class="bubble"><small><i data-icon="spark"></i>Exemple de phrase</small><p>« Dimanche 9h30, boucle de 8 km depuis la gare de Gif-sur-Yvette, niveau facile »</p></div>
    <div class="steps">
      <div class="step"><span>1</span><b>Tu écris ton idée</b></div>
      <div class="step"><span>2</span><b>L'IA prépare la fiche</b></div>
      <div class="step"><span>3</span><b>Le groupe te rejoint</b></div>
    </div>
  </div>
</div>
<script src="social.js"></script></body></html>
