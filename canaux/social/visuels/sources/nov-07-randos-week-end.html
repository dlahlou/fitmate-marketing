<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Nov 07 Randos du week-end</title>
<link rel="stylesheet" href="social.css">
<style>
  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .day { background: #fff; color: var(--ink); border-radius: 36px; padding: 34px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .day .ic { width: 76px; height: 76px; border-radius: 24px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--orange), var(--red)); }
  .day .ic svg { width: 40px; height: 40px; }
  .day b { display: block; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 54px; margin-top: 22px; letter-spacing: -.01em; }
  .day p { font-size: 26px; font-weight: 500; color: #55555c; margin-top: 6px; }
  .facts { display: flex; flex-direction: column; gap: 18px; margin-top: 30px; }
  .facts div { display: flex; align-items: center; gap: 20px; font-size: 32px; font-weight: 700; }
  .facts i { display: grid; place-items: center; flex: none; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.12); color: #ff8a2a; }
  .facts i svg { width: 30px; height: 30px; }
</style></head>
<body><div class="canvas post ink">
  <div class="head">
    <div class="kicker">🌳 Île-de-France</div>
    <h1>Ce week-end, <em>on marche où ?</em></h1>
    <p class="sub">Les randos en groupe du samedi et du dimanche, sur une seule page</p>
  </div>
  <div class="zone" style="top:690px">
    <div class="days">
      <div class="day"><div class="ic" data-icon="cal"></div><b>Samedi</b><p>Les sorties prévues</p></div>
      <div class="day"><div class="ic" data-icon="cal"></div><b>Dimanche</b><p>Les sorties prévues</p></div>
    </div>
    <div class="facts">
      <div><i data-icon="train"></i>Les départs en gare signalés</div>
      <div><i data-icon="gauge"></i>Le niveau sur chaque fiche</div>
      <div><i data-icon="euro"></i>Le prix affiché si la sortie est payante</div>
    </div>
  </div>
</div>
<script src="social.js"></script></body></html>
