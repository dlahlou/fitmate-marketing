<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>09 Télécharger</title>
<link rel="stylesheet" href="social.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 22px; }
  .bio { margin-top: 40px; text-align: center; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 48px; }
  .bio span { display: inline-block; background: var(--ink); color: var(--lime); padding: 14px 34px; border-radius: 999px; }
</style></head>
<body><div class="canvas post">
  <div class="head">
    <div class="kicker">📲 Télécharger</div>
    <h1 class="xl">Ta prochaine sortie <em>t'attend</em></h1>
    <p class="sub">L'app est gratuite. Rejoins une sortie ou crée la tienne</p>
  </div>
  <div class="zone" style="top:720px">
    <div class="stack">
      <div class="pill"><span class="ic" data-icon="phone"></span><div>iPhone<small>sur l'App Store</small></div></div>
      <div class="pill"><span class="ic" data-icon="phone"></span><div>Android<small>sur Google Play</small></div></div>
      <div class="pill"><span class="ic" data-icon="globe"></span><div>app.fitmates.net<small>directement dans ton navigateur</small></div></div>
    </div>
    <div class="bio"><span>Lien en bio ↑</span></div>
  </div>
</div>
<script src="social.js"></script></body></html>
